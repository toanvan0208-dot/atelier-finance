<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <style>
      .actor { font:20px 'Segoe UI', Roboto, Arial; fill:#0F172A }
      .lifeline { stroke:#9CA3AF; stroke-dasharray:4 4 }
      .box { fill:#F8FAFC; stroke:#CBD5E1; stroke-width:1 }
      .arrow { stroke:#111827; stroke-width:2.5; fill:none }
      .label { font:16px 'Segoe UI', Roboto, Arial; fill:#0B1220 }
      .note { font:14px 'Segoe UI', Roboto, Arial; fill:#0B1220 }
    </style>
  </defs>

  <g transform="translate(0,10)">
    <g>
      <rect x="80" y="10" width="220" height="44" class="box"/>
      <text x="190" y="40" text-anchor="middle" class="actor">Người dùng</text>

      <rect x="320" y="10" width="260" height="44" class="box"/>
      <text x="450" y="40" text-anchor="middle" class="actor">Frontend Workspace</text>

      <rect x="620" y="10" width="260" height="44" class="box"/>
      <text x="750" y="40" text-anchor="middle" class="actor">Backend/API Routes</text>

      <rect x="940" y="10" width="200" height="44" class="box"/>
      <text x="1040" y="40" text-anchor="middle" class="actor">Data Layer</text>

      <rect x="1160" y="10" width="200" height="44" class="box"/>
      <text x="1260" y="40" text-anchor="middle" class="actor">Prisma ORM</text>

      <rect x="1380" y="10" width="260" height="44" class="box"/>
      <text x="1510" y="40" text-anchor="middle" class="actor">PostgreSQL Database</text>

      <rect x="1720" y="10" width="260" height="44" class="box"/>
      <text x="1850" y="40" text-anchor="middle" class="actor">AI Assistant API</text>

      <rect x="1960" y="10" width="260" height="44" class="box"/>
      <text x="2090" y="40" text-anchor="middle" class="actor">AI Provider / LLM</text>
    </g>

    <g>
      <line x1="190" y1="80" x2="190" y2="1280" class="lifeline"/>
      <line x1="450" y1="80" x2="450" y2="1280" class="lifeline"/>
      <line x1="750" y1="80" x2="750" y2="1280" class="lifeline"/>
      <line x1="1040" y1="80" x2="1040" y2="1280" class="lifeline"/>
      <line x1="1260" y1="80" x2="1260" y2="1280" class="lifeline"/>
      <line x1="1510" y1="80" x2="1510" y2="1280" class="lifeline"/>
      <line x1="1850" y1="80" x2="1850" y2="1280" class="lifeline"/>
      <line x1="2090" y1="80" x2="2090" y2="1280" class="lifeline"/>
    </g>

    <g>
      <path d="M190 170 L450 170" class="arrow"/>
      <text x="320" y="158" class="label" text-anchor="middle">Chọn ticker & module</text>
    </g>

    <g>
      <path d="M450 240 L750 240" class="arrow"/>
      <text x="600" y="228" class="label" text-anchor="middle">GET /api/financial?ticker=...&module=...</text>
    </g>

    <g>
      <path d="M750 300 L750 320" stroke="#111827" stroke-width="2.5"/>
      <text x="790" y="312" class="label">Kiểm tra params</text>
    </g>

    <g>
      <path d="M750 360 L1040 360" class="arrow"/>
      <text x="895" y="348" class="label" text-anchor="middle">Yêu cầu dữ liệu (ticker, module, period)</text>
    </g>

    <g>
      <path d="M1040 420 L1260 420" class="arrow"/>
      <text x="1150" y="408" class="label" text-anchor="middle">Truy vấn qua Prisma</text>
    </g>

    <g>
      <path d="M1260 480 L1510 480" class="arrow"/>
      <text x="1385" y="468" class="label" text-anchor="middle">SQL query -> PostgreSQL</text>
    </g>

    <g>
      <path d="M1510 540 L1260 540" class="arrow"/>
      <text x="1385" y="532" class="label" text-anchor="middle">DB trả về dữ liệu (financials, price, sources, quality)</text>
    </g>

    <g>
      <path d="M1260 600 L1040 600" class="arrow"/>
      <text x="1150" y="592" class="label" text-anchor="middle">Prisma -> Data Layer: dữ liệu thô</text>
    </g>

    <g>
      <rect x="900" y="640" width="420" height="64" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="1110" y="678" text-anchor="middle" class="note">DL kiểm tra missingFields, đơn vị, nguồn, điều kiện diễn giải</text>
    </g>

    <g>
      <path d="M1040 740 L750 740" class="arrow"/>
      <text x="895" y="728" class="label" text-anchor="middle">DL trả dữ liệu đã kiểm soát</text>
    </g>

    <g>
      <path d="M750 800 L450 800" class="arrow"/>
      <text x="600" y="788" class="label" text-anchor="middle">HTTP 200 + {data, dataQuality, missingFields, warnings, allowedNumericValues}</text>
    </g>

    <g>
      <rect x="320" y="840" width="300" height="52" rx="8" class="box"/>
      <text x="470" y="872" text-anchor="middle" class="label">FE hiển thị dữ liệu & cảnh báo chất lượng</text>
    </g>

    <g>
      <path d="M190 940 L450 940" class="arrow"/>
      <text x="320" y="928" class="label" text-anchor="middle">Người dùng hỏi AI Assistant</text>
    </g>

    <g>
      <path d="M450 1000 L1850 1000" class="arrow"/>
      <text x="1150" y="988" class="label" text-anchor="middle">POST /api/ai-explain {context: question,ticker,activeModule,moduleContext,dataQuality,...}</text>
    </g>

    <g>
      <rect x="1480" y="1040" width="560" height="120" rx="8" fill="#EFF6FF" stroke="#60A5FA"/>
      <text x="1760" y="1080" class="note" text-anchor="middle">AIA kiểm tra guardrails:\n- Không khuyến nghị mua/bán/nắm giữ\n- Không bịa số liệu\n- Không dùng số ngoài allowedNumericValues\n- Không diễn giải khi dữ liệu thiếu\n- Không đưa target price / fair value / upside/downside</text>
    </g>

    <g>
      <path d="M1850 1180 L2090 1180" class="arrow"/>
      <text x="1970" y="1168" class="label" text-anchor="middle">Gọi LLM với context đã kiểm soát</text>
    </g>

    <g>
      <path d="M2090 1240 L1850 1240" class="arrow"/>
      <text x="1970" y="1228" class="label" text-anchor="middle">LLM trả explanation</text>
    </g>

    <g>
      <path d="M1850 1300 L450 1300" class="arrow"/>
      <text x="1150" y="1288" class="label" text-anchor="middle">AIA sanitize & trả về FE (explanation + warnings)</text>
    </g>

  </g>
</svg>
